name: "Edge-Proxy-Profile"
manufacturer: "HY"
model: "test"
labels:
  - "edgex-proxy"
description: "边缘代理节点"

deviceResources:
  - name: "Router_Parameter_Query"   # 路由参数查询，查询所有拓扑信息
    isHidden: true
    description: "0未开启 1查询全部通用参数"
    properties:
      valueType: "Int8"    
      readWrite: "W"        
      units: ""            
      defaultValue: "0"     
  - name: "topologyDiagram"   # 路由信息 <EID> <EID TYPE> <EID STA> <EID PARANT>
    isHidden: true
    description: "任意 JSON 对象"
    properties:
      valueType: "Object"    
      readWrite: "R"        
      units: ""            
      defaultValue: "{}"     
  - name: "eid"                # 设备唯一标识
    isHidden: false                   
    description: ""
    properties:
      valueType: "String"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "238A08262316"    
  - name: "getdata"  
    isHidden: true
    description: "0未开启 1网关监测数据查询"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"  
  - name: "reset"  
    isHidden: true
    description: "0未开启 1网关复位"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"  
  - name: "settime"  
    isHidden: true
    description: "0未开启 1设置时间"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"  
deviceCommands:
  -
    name: "commandTopologyDiagram"
    readWrite: "W"
    isHidden: false
    resourceOperations:
      - { deviceResource: "topologyDiagram", defaultValue: "0" }

